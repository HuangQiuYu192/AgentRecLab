[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentreclab"
version = "0.2.0"
description = "Auditable offline instruction-aware recommendation experiments"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "typer>=0.15,<1", "pyyaml>=6,<7", "pandas>=2.2", "pyarrow>=18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
agentreclab = "main:entrypoint"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "utils*"]
exclude = ["utils.tests*"]

[tool.pytest.ini_options]
testpaths = ["utils/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
