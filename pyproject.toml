[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentreclab"
version = "0.1.0"
description = "Auditable offline instruction-aware recommendation experiments"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "typer>=0.15,<1", "pyyaml>=6,<7", "numpy>=1.26", "pandas>=2.2", "pyarrow>=18", "openai>=1.43"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
agentreclab = "agentreclab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
